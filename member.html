<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AI BioTech — Member Area (Staging)</title><link rel="stylesheet" href="/staging-member.css?v=20260829a"></head>
<body><div class="stage-member">STAGING MEMBER AREA — NO PRODUCTION CUSTOMER OR ORDER DATA</div><main class="member-shell"><header class="member-head"><div class="member-brand"><div>🧬</div><strong><span>AI</span> BioTech Member</strong></div><div class="head-actions"><a class="btn" href="/">Store</a><a class="btn" href="/checkout.html">Checkout</a><button id="memberSignOut" class="btn" hidden>Sign Out</button></div></header>
<section id="memberLogin" class="auth card"><h1>Member Sign In</h1><p class="muted">This is the isolated staging account system.</p><div class="form-grid"><label class="wide">Email<input id="memberEmail" class="field" type="email" autocomplete="username" placeholder="Email"></label><label class="wide">Password<input id="memberPassword" class="field" type="password" autocomplete="current-password" placeholder="Password"></label></div><div class="row-actions"><button class="btn primary" onclick="memberSignIn()">Sign In</button><button class="btn" onclick="showRegister()">Register</button><button class="btn" onclick="memberForgot()">Forgot Password</button></div><div id="memberMessage" class="notice" hidden></div><div id="registerBox" hidden style="margin-top:20px"><h2>Create Staging Account</h2><div class="form-grid"><label>Name<input id="registerName" class="field"></label><label>Phone<input id="registerPhone" class="field"></label><label>Email<input id="registerEmail" class="field" type="email"></label><label>Password<input id="registerPassword" class="field" type="password" minlength="8"></label></div><div class="row-actions"><button class="btn primary" onclick="memberRegister()">Create Account</button></div></div></section>
<section id="memberApp" hidden><div class="stats"><div class="card stat"><small>Wallet</small><b id="walletBalance">RM 0.00</b></div><div class="card stat"><small>Orders</small><b id="orderCount">0</b></div><div class="card stat"><small>Invoices</small><b id="invoiceCount">0</b></div><div class="card stat"><small>Tracked Shipments</small><b id="trackingCount">0</b></div></div><nav class="tabs"><button class="btn active" data-tab="overview" onclick="openMemberTab('overview')">Overview</button><button class="btn" data-tab="orders" onclick="openMemberTab('orders')">Orders</button><button class="btn" data-tab="wallet" onclick="openMemberTab('wallet')">Wallet</button><button class="btn" data-tab="profile" onclick="openMemberTab('profile')">Profile & Addresses</button><button class="btn" data-tab="protocols" onclick="openMemberTab('protocols')">Protocols</button></nav><section id="memberPanel" class="card"></section></section></main>
<dialog id="memberDialog" class="dialog"><div class="dialog-head"><h2 id="memberDialogTitle">Details</h2><button class="x" onclick="closeMemberDialog()" aria-label="Close">×</button></div><div id="memberDialogBody" class="dialog-body"></div><div id="memberDialogFoot" class="dialog-foot"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/staging-config.js?v=20260829a"></script><script src="/staging-member.js?v=20260829a"></script></body></html>

<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ai Biotech Store</title><style>html,body{margin:0;background:#020812;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{color:#22d3ee}</style></head><body><div class='loading' id='boot'><div><b>Ai Biotech</b><br>Loading storefront…</div></div><script>(async()=>{const SOURCE='https://ai-biotech-store-dcco7jphj-rk-cd1c.vercel.app';try{let html=await (await fetch(SOURCE,{cache:'no-store'})).text();const replacement=String.raw`function visual(p,v,el){const r=real(p,v);if(r){el.innerHTML=\`<img src='\${r}' alt='\${p.name}'>\`;return}const src=masters[v?.form||'Vial'];if(!src){el.innerHTML=\`<div class='missing'><b>\${v?.form||'Vial'} MASTER NOT UPLOADED</b><br><small>Admin → Master Placeholders</small></div>\`;return}const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');c.width=900;c.height=900;x.fillStyle='#000';x.fillRect(0,0,900,900);const sc=Math.min(900/im.width,900/im.height),w=im.width*sc,h=im.height*sc,ox=(900-w)/2,oy=(900-h)/2;x.drawImage(im,ox,oy,w,h);const d=x.getImageData(0,0,900,900),a=d.data,t=rgb(color(p));for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2];if(r>130&&g>45&&g<195&&b<110&&r-g>28){const L=(r+g+b)/765;a[i]=Math.min(255,t.r*(.55+.65*L));a[i+1]=Math.min(255,t.g*(.55+.65*L));a[i+2]=Math.min(255,t.b*(.55+.65*L))}}x.putImageData(d,0,0);const isV=(v?.form||'Vial')==='Vial',nm=String(p.name||'').replace(/\\s+\\d+(?:\\.\\d+)?\\s*(MG|ML)$/i,'').trim();if(isV){heal(x,292,425,316,61);heal(x,365,491,170,53);x.textAlign='center';x.textBaseline='middle';fit(x,nm,450,456,290,48,800,color(p));fit(x,main(v.strength),450,517,155,42,800,'#111')}else{heal(x,425,420,205,47);heal(x,718,420,72,48);x.textAlign='center';x.textBaseline='middle';fit(x,nm,528,444,195,34,800,color(p));fit(x,main(v.strength),754,444,62,23,800,'#111')}el.innerHTML='';el.appendChild(c)};im.src=src}function heal(ctx,x,y,w,h){const W=ctx.canvas.width,H=ctx.canvas.height,src=ctx.getImageData(0,0,W,H),sd=src.data,out=ctx.createImageData(w,h),od=out.data,ty=Math.max(0,y-5),by=Math.min(H-1,y+h+5);for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const px=x+xx,q=yy/Math.max(1,h-1),ti=(ty*W+px)*4,bi=(by*W+px)*4,oi=(yy*w+xx)*4;for(let k=0;k<3;k++)od[oi+k]=sd[ti+k]*(1-q)+sd[bi+k]*q;od[oi+3]=255}ctx.putImageData(out,x,y)}function rgb`;const re=/function visual\(p,v,el\)\{[\s\S]*?\}function rgb/;if(!re.test(html))throw new Error('Renderer signature not found');html=html.replace(re,replacement);document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>Ai Biotech</b><br>Storefront could not load.<br><small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>

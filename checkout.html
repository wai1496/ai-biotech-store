<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Checkout — AI BioTech</title><link rel="stylesheet" href="/member.css"></head><body><main class="member-shell"><header class="member-head"><h1>Checkout</h1><a class="btn" href="/">Continue shopping</a><a class="btn" href="/member.html">Member area</a></header><section id="checkoutLogin" class="auth card" hidden><h2>Sign in required</h2><p>Checkout uses your member account for order history, wallet and protocols.</p><a class="btn primary" href="/member.html">Open member sign in</a></section><section id="checkoutApp" hidden><div class="form-grid"><section class="panel card"><h2>Your cart</h2><div id="checkoutItems"></div><div class="notice"><b>Subtotal: <span id="checkoutSubtotal">RM 0.00</span></b></div></section><section class="panel card"><h2>Shipping</h2><select id="checkoutAddress" class="wide-input"></select><button class="btn" onclick="useNewAddress()">Use new address</button><h3>Voucher</h3><input id="voucherCode" class="wide-input" placeholder="Voucher code"><h3>Wallet</h3><p>Available: <b id="checkoutWallet">RM 0.00</b></p><input id="walletAmount" class="wide-input" type="number" min="0" step="0.01" value="0"><h3>Order note</h3><textarea id="checkoutNote" class="wide-input" rows="4"></textarea><button id="placeOrderBtn" class="btn primary" style="width:100%;margin-top:12px" onclick="placeOrder()">PLACE ORDER</button><p id="checkoutMessage"></p></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/checkout.js"></script></body></html>

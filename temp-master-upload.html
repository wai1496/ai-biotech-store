<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI BioTech — Temporary Master Upload</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#13233f;font-family:Arial,sans-serif}.bar{padding:16px 18px;background:#10294c;color:#fff}.bar b{font-size:20px}.shell{max-width:960px;margin:auto;padding:20px}.notice{background:#fff7dd;border:1px solid #efd98a;border-radius:14px;padding:14px;margin-bottom:18px}.login,.card{background:#fff;border:1px solid #dce4ed;border-radius:18px;padding:18px;margin-bottom:16px}.login input{width:100%;padding:13px;margin:6px 0;border:1px solid #ccd8e4;border-radius:10px;font-size:16px}.btn{border:1px solid #cbd7e2;background:#fff;color:#10294c;border-radius:10px;padding:12px 15px;font-weight:700;min-height:44px}.primary{background:#1477ff;color:#fff;border-color:#1477ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.preview{height:250px;background:#f7f9fc;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:12px 0}.preview img{width:100%;height:100%;object-fit:contain}.file{width:100%;padding:12px;border:1px dashed #aab9c7;border-radius:10px}.status{font-size:13px;color:#64758b;min-height:34px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:14px}.preview{height:300px}}</style></head><body><div class="bar"><b>AI BioTech · Temporary Staging Upload</b></div><main class="shell"><div class="notice"><b>STAGING ONLY</b><br>This temporary page uploads master images to the staging Supabase project. It does not touch production.</div><section id="login" class="login"><h2>Super Admin Sign In</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signIn" class="btn primary">Sign In</button><p id="loginStatus" class="status"></p></section><section id="uploader" class="hidden"><div class="grid" id="grid"></div><div class="actions"><a class="btn" href="/admin.html">Back to Admin</a><a class="btn" href="/">Open Staging Store</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yjauxyvtrmdriwtmckkl.supabase.co','sb_publishable_xib7Xo5_y1G75gSAmkW9QQ__H5-mgZF');const formats=['Vial','Pen','Cartridge'];const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function auth(){const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Please sign in');const {data}=await sb.from('admin_users').select('role,active').eq('user_id',user.id).maybeSingle();if(!data?.active||data.role!=='super_admin')throw Error('Super Admin access required');return user}async function load(){const user=await auth(),{data,error}=await sb.from('media_templates').select('*').order('format');if(error)throw error;login.classList.add('hidden');uploader.classList.remove('hidden');grid.innerHTML=formats.map(f=>{const t=(data||[]).find(x=>x.format===f)||{id:f.toLowerCase()+'-master',format:f,version:0,master_image_url:''};return `<article class="card" data-id="${esc(t.id)}" data-format="${f}" data-version="${Number(t.version||0)}"><h2>${f} Master</h2><div class="preview"><img src="${esc(t.master_image_url)}" alt="${f} preview"></div><input class="file" type="file" accept="image/png,image/jpeg,image/webp"><p class="status">Version ${Number(t.version||0)} · Choose an image to preview.</p><div class="actions"><button type="button" class="btn previewBtn">Preview</button><button type="button" class="btn primary uploadBtn">Upload to Staging</button></div></article>`}).join('');document.querySelectorAll('.card[data-format]').forEach(card=>{const input=card.querySelector('.file'),img=card.querySelector('img'),status=card.querySelector('.status');card.querySelector('.previewBtn').onclick=()=>{const file=input.files?.[0];if(!file)return status.textContent='Choose an image first.';img.src=URL.createObjectURL(file);status.textContent=`Previewing ${file.name} · not uploaded yet.`};card.querySelector('.uploadBtn').onclick=async()=>{const file=input.files?.[0];if(!file)return status.textContent='Choose an image first.';if(file.size>12*1024*1024)return status.textContent='Maximum file size is 12 MB.';const btn=card.querySelector('.uploadBtn');btn.disabled=true;try{const user=await auth(),format=card.dataset.format,id=card.dataset.id,version=Number(card.dataset.version||0)+1,ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=`masters/staging/${format.toLowerCase()}-master-v${version}-${Date.now()}.${ext}`;status.textContent='Uploading…';const {error:up}=await sb.storage.from('catalog-media').upload(path,file,{contentType:file.type,upsert:false});if(up)throw up;const {data:pub}=sb.storage.from('catalog-media').getPublicUrl(path),url=pub.publicUrl;const {error:save}=await sb.from('media_templates').update({master_image_url:url,version,label_config:{category_accent:true,real_image_priority:true,dynamic_product_name:true,dynamic_strength:true,dynamic_cap_color:format==='Vial',dynamic_stopper_color:format==='Vial',staging_uploaded:true},notes:`Temporary staging upload ${new Date().toLocaleString()}`,updated_at:new Date().toISOString(),updated_by:user.id}).eq('id',id);if(save)throw save;card.dataset.version=version;img.src=url;status.textContent=`Uploaded successfully · Version ${version}`;}catch(e){status.textContent='Upload failed: '+e.message}finally{btn.disabled=false}}})}signIn.onclick=async()=>{loginStatus.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return loginStatus.textContent=error.message;try{await load()}catch(e){loginStatus.textContent=e.message}};(async()=>{try{await load()}catch{}})();</script></body></html>

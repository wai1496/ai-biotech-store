name: AI BioTech site smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate routes and linked assets
        run: node scripts/smoke-check.mjs
      - name: Validate unresolved storefront issue fixes
        run: node scripts/storefront-live-issues-check.mjs
      - name: Validate preview-only visual composer
        shell: bash
        run: |
          set -euo pipefail
          for file in qa/visual-composer-*.test.js; do node "$file"; done
      - name: Validate storefront runtime visuals
        run: node qa/storefront-runtime-visuals.test.js
      - name: Validate Malaysia checkout address flow
        run: node qa/checkout-malaysia-address.test.js
      - name: Validate mobile member navigation
        run: node qa/mobile-member-nav.test.js
      - name: Validate continue-shopping cart flow
        run: node qa/cart-continue-shopping.test.js
      - name: Validate ToyyibPay sandbox flow
        run: node qa/toyyibpay-sandbox.test.js
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

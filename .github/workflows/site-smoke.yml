name: AI BioTech site smoke check

on:
  push:
    branches: [main, staging/master-build, review/master-build-20260829]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staging environment contract
        run: node scripts/environment-contract-check.mjs
      - name: Validate routes and linked assets
        run: node scripts/smoke-check.mjs
      - name: Validate staging controls and AI isolation
        run: node scripts/staging-control-check.mjs
      - name: Validate staging integration safety
        run: node scripts/staging-integration-check.mjs
      - name: Validate automation dry-run safety
        run: node scripts/staging-automation-check.mjs
      - name: Validate recovery safety
        run: node scripts/recovery-safety-check.mjs
      - name: Validate visible interaction contracts
        run: node scripts/interaction-check.mjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

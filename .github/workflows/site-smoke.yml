name: AI BioTech site smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate regression contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(qa/*.test.js)
          for file in "${tests[@]}"; do
            echo "Running $file"
            node "$file"
          done
      - name: Validate routes and linked assets
        run: node scripts/smoke-check.mjs
      - name: Validate unresolved storefront issue fixes
        run: node scripts/storefront-live-issues-check.mjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

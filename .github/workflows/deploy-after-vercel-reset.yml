name: Deploy latest AI BioTech build after Vercel reset

on:
  schedule:
    - cron: '35 8 30 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-latest-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger one production build after the daily Vercel deployment quota resets
        shell: bash
        run: |
          set -euo pipefail
          marker=".vercel-deploy-trigger-20260830"
          if [[ -f "$marker" ]]; then
            echo "Deployment trigger already committed. Nothing to do."
            exit 0
          fi
          printf 'Trigger latest production deployment after Vercel daily quota reset.\nSource commit before trigger: %s\nTriggered at UTC: %s\n' "$(git rev-parse HEAD)" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$marker"
          git config user.name "AI BioTech Deployment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$marker"
          git commit -m "Trigger production deploy after Vercel quota reset"
          git push origin HEAD:main

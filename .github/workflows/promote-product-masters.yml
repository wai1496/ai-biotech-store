name: Promote approved product masters

on:
  push:
    branches: [review/master-build-20260829]
    paths:
      - .github/workflows/promote-product-masters.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-product-masters-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/review/master-build-20260829'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated review branch
        uses: actions/checkout@v4
        with:
          ref: review/master-build-20260829
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Download the previously approved public master uploads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .master-build
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://yjauxyvtrmdriwtmckkl.supabase.co/storage/v1/object/public/catalog-media/masters/staging/vial-master-v3-1788052468972.png' \
            --output .master-build/vial-source.png
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://yjauxyvtrmdriwtmckkl.supabase.co/storage/v1/object/public/catalog-media/masters/staging/pen-master-v3-1788052465947.png' \
            --output .master-build/pen-source.png
          file .master-build/vial-source.png .master-build/pen-source.png

      - name: Generate transparent masters and exact Vial masks
        run: python scripts/build-product-masters.py

      - name: Commit generated review-owned assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI BioTech Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            assets/vial-master-v4.svg \
            assets/pen-master-v4.svg \
            assets/vial-cap-mask.svg \
            assets/vial-stopper-mask.svg \
            assets/vial-strength-mask.svg
          if git diff --cached --quiet; then
            echo 'Generated assets already match the review branch.'
            exit 0
          fi
          git commit -m 'assets: promote approved product masters and Vial masks'
          git push origin HEAD:review/master-build-20260829

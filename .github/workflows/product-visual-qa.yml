name: AI BioTech product visual QA

on:
  push:
    branches: [review/master-build-20260829]
    paths:
      - 'index.html'
      - 'staging-config.js'
      - 'clean-store.js'
      - 'product-visual-resolver.js'
      - 'product-visuals.css'
      - 'assets/**'
      - 'tests/product-visuals.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/product-visual-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'staging-config.js'
      - 'clean-store.js'
      - 'product-visual-resolver.js'
      - 'product-visuals.css'
      - 'assets/**'
      - 'tests/product-visuals.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run six-viewport product visual tests
        run: npm run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-visual-qa-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Report outcome to WP-03
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            STATUS="PASS"
            DETAIL="Six-viewport Playwright product-visual QA passed. The workflow artifact contains screenshots and the HTML report."
          else
            ICON="❌"
            STATUS="FAIL / FIXING"
            DETAIL="Independent Playwright product-visual QA failed. WP-03 remains open and must be repaired and retested."
          fi

          BODY=$(cat <<EOF
          ## Automated visual QA — ${ICON} ${STATUS}

          - Commit: \`${SHA}\`
          - Workflow status: **${JOB_STATUS}**
          - Evidence: ${RUN_URL}

          ${DETAIL}

          A successful deployment alone is not treated as QA approval.
          EOF
          )

          gh api "repos/${REPOSITORY}/issues/8/comments" -f body="$BODY"

name: Temporary protected Preview functional QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-functional-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  member-checkout-payment-return:
    if: github.event.pull_request.number == 39 && github.head_ref == 'integration/white-clean-core-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://ai-biotech-store-bccljqgc3-rk-cd1c.vercel.app
      FUNCTIONAL_QA_ARTIFACT_DIR: artifacts/preview-functional-qa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Request short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run disposable authenticated Preview QA
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/playwright-preview-functional-qa.mjs

      - name: Upload sanitized Preview functional-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-functional-qa-${{ github.run_id }}
          path: artifacts/preview-functional-qa
          if-no-files-found: error
          retention-days: 7
